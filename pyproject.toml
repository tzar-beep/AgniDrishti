[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnidrishti"
version = "0.1.0"
description = "Weekly wildfire hotspot risk prediction for Uttarakhand, India"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "geopandas==1.0.1",
    "shapely==2.0.6",
    "pyproj==3.7.0",
    "rasterio==1.4.3",
    "xarray==2024.11.0",
    "requests==2.32.3",
    "pyarrow==18.1.0",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "shap==0.46.0",
    "joblib==1.4.2",
    "matplotlib==3.9.3",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "pydantic==2.10.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.8.4"]

[tool.setuptools.packages.find]
include = ["agnidrishti*"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
